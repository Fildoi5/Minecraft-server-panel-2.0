<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 100px;
            margin: 0px;
            background-color: #0A2647;
            color: white;
        }

        main{
            display: flex;
            justify-self: center;

            flex-direction: column;
            gap: 20px;
            background-color: #144272;
            padding: 30px;
            border-radius: 20px;
        }

        h2{
            margin: 0px;
            padding: 0px;
            text-align: center;
        }

        #msg_text{
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            width: 200px;
            border: 1px grey solid;
            border-radius: 10px;
            padding: 10px;
        }

        button{
            width: 100px;
            border: 1px grey solid;
            border-radius: 10px;
            padding: 5px;
        }

        #s{
            display: flex;
            justify-content: center;
        }
    </style>
</head>

<body>
    <main>
        <h2>Login</h2>

        <form action="/login" method="post">
            <div id="msg_text">{{ msg }}</div>

            <input type="text" name="username" placeholder="Enter Username" required>
            <input type="password" name="password" placeholder="Enter Password" required>

            <div id="s"><button class="btn" type="submit">Login</button></div>
            
        </form>
    </main>
</body>

</html>
