<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create new password</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            padding: 100px;
            margin: 0px;
            background-color: #0A2647;
            color: white;
        }

        main {
            display: flex;
            justify-self: center;

            flex-direction: column;
            gap: 20px;
            background-color: #144272;
            padding: 30px;
            border-radius: 20px;
        }

        h2 {
            margin: 0px;
            padding: 0px;
            text-align: center;
        }

        #msg_text {
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            width: 200px;
            border: 1px grey solid;
            border-radius: 10px;
            padding: 10px;
        }

        button {
            width: 100px;
            border: 1px grey solid;
            border-radius: 10px;
            padding: 5px;
        }

        #s {
            display: flex;
            justify-content: center;
        }

        #pswd {
            display: flex;
            gap: 0px;
            flex-direction: row;
        }

        #show {
            margin: 5px;
            padding: 0px;
            width: 20px;
        }
    </style>
</head>

<body>
    <main>
        <h2>Create new password</h2>

        <form action="/create_user" method="post">

            <input type="text" name="username" placeholder="Enter Username" required>
            <div id="pswd">
                <input type="password" name="password" placeholder="Enter Password" id="password" required>
                <input type="checkbox" id="show" onclick="sh()">
            </div>


            <div id="s"><button class="btn" type="submit">Login</button></div>

        </form>
    </main>

    <script>
        function sh() {
            var x = document.getElementById("password");
            if (x.type === "password") {
                x.type = "text";
            } else {
                x.type = "password";
            }
        }
    </script>
</body>

</html>
